x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-php-service: &php-service
  image: notification-service-php:local
  build:
    context: main/_docker/app
    dockerfile: Dockerfile
    args: { UID: "${UID:-1000}", GID: "${GID:-1000}", TZ: "${TZ:-UTC}" }
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  working_dir: /var/www
  volumes:
    - ./main:/var/www
    - ./main/_docker/app/php.ini:/usr/local/etc/php/conf.d/additional.ini:ro
  networks:
    - postgres_network
    - rabbitmq_network
    - redis_network
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *default-logging

services:

  # --------------------------------------------------------
  # PHP: fpm + воркер очереди + планировщик (один образ)
  # --------------------------------------------------------

  app:
    <<: *php-service
    container_name: ${COMPOSE_PROJECT_NAME}_app
    networks:
      - app_network
      - postgres_network
      - rabbitmq_network
      - redis_network
    healthcheck:
      test: [ "CMD-SHELL", "pgrep php-fpm" ]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *php-service
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    command: [ "php", "artisan", "queue:work", "rabbitmq", "--queue=high_priority_queue,low_priority_queue,default", "--max-time=3600", "--sleep=1" ]
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'queue:work'" ]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler:
    <<: *php-service
    container_name: ${COMPOSE_PROJECT_NAME}_scheduler
    command: [ "php", "artisan", "schedule:work" ]
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'schedule:work'" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # HTTP
  # --------------------------------------------------------

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    image: "nginx:${NGINX_VERSION:-1.27-alpine}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${NGINX_FORWARD_PORT:-80}:80"
    volumes:
      - ./main:/var/www:ro
      - ./main/_docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up" ]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # --------------------------------------------------------
  # Redis (кэш, rate limiting)
  # --------------------------------------------------------

  redis:
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    image: "redis:${REDIS_VERSION:-7-alpine}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    networks:
      - redis_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  # --------------------------------------------------------
  # Данные: Postgres + RabbitMQ
  # --------------------------------------------------------

  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    image: "postgres:${POSTGRES_VERSION:-16-alpine}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE:?}"
      POSTGRES_USER: "${POSTGRES_USERNAME:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
    ports:
      - "127.0.0.1:${POSTGRES_FORWARD_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./main/_docker/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - postgres_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE} -h 127.0.0.1" ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  rabbitmq:
    container_name: ${COMPOSE_PROJECT_NAME}_rabbitmq
    image: "rabbitmq:${RABBITMQ_VERSION:-4-management-alpine}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?}"
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_FORWARD_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rabbitmq_network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *default-logging

networks:
  app_network: { driver: bridge }
  postgres_network: { driver: bridge }
  rabbitmq_network: { driver: bridge }
  redis_network: { driver: bridge }

volumes:
  pg_data: { driver: local }
  rabbitmq_data: { driver: local }
  redis_data: { driver: local }
