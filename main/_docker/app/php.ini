; Переопределения поверх php.ini-production (база задана в Dockerfile).

memory_limit = 256M
max_execution_time = 30

; JSON-API: файлы не загружаются
upload_max_filesize = 2M
post_max_size = 2M

expose_php = Off

; Код примонтирован с хоста — правки видны без перезапуска fpm
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.memory_consumption = 128
